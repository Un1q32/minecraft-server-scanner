[package]
name = "dbviewer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fast Qt viewer for the Minecraft scanner's servers.db (Rust)"

[dependencies]
chrono = "0.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
