name: Build Minecraft mod

on:
  push:
    paths:
      - "minecraft-mod/**"
      - "scanner.py"
      - "mcscan.py"
      - "db_format.py"
      - ".github/workflows/build-minecraft-mod.yml"
  pull_request:
    paths:
      - "minecraft-mod/**"
      - "scanner.py"
      - "mcscan.py"
      - "db_format.py"
      - ".github/workflows/build-minecraft-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-mod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric mod jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: minecraft-mod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build mod
        run: ./gradlew --no-daemon --stacktrace build

      - name: List built jars
        run: ls -lh build/libs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mcdb-browser-mod
          path: minecraft-mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
