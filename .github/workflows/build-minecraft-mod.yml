name: Build and release Minecraft mod

on:
  push:
    branches:
      - "**"
    paths:
      - "minecraft-mod/**"
      - "scanner.py"
      - "mcscan.py"
      - "db_format.py"
      - ".github/workflows/build-minecraft-mod.yml"
  pull_request:
    paths:
      - "minecraft-mod/**"
      - "scanner.py"
      - "mcscan.py"
      - "db_format.py"
      - ".github/workflows/build-minecraft-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-mod-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish mod jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: minecraft-mod

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build mod
        run: ./gradlew --no-daemon --stacktrace build

      - name: List built jars
        run: ls -lh build/libs

      - name: Publish build release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="build-${SHORT_SHA}"
          ls build/libs/*.jar >/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/libs/*.jar --clobber
          else
            gh release create "$TAG" build/libs/*.jar \
              --title "MCDB Browser build ${SHORT_SHA}" \
              --notes "Automated build of ${GITHUB_SHA} on ${GITHUB_REF_NAME}."
          fi
